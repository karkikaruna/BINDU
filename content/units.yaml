      english_options:
      - what is your name?
      - tell me your age
      - where are you from
      - how are you
      english_answer:
      - what is your name?
    - order_index: 3
      type: multiple_choice
      english_prompt: Which sentence means 'I am from Nepal'?
      english_options:
      - I live in Nepal
      - I am from Nepal
      - I have visited Nepal
      - I want to visit Nepal
      english_answer:
      - I am from Nepal
    - order_index: 4
      type: word_bank
      english_prompt: 'Arrange: ''I am a student'''
