      - am
      - a
      - student
      english_answer:
      - I
      - am
      - a
      - student
    - order_index: 5
      type: multiple_choice
      english_prompt: Which phrase means 'Nice to meet you'?
      english_options:
      - Nice to meet you
      - See you tomorrow
      - How much is it
      - I am hungry
      english_answer:
      - Nice to meet you
    - order_index: 6
      type: multiple_choice
      english_prompt: 'Fill in: ''I am 25 years old'''
      english_options:
      - I am feeling tired
      - I am 25 years old
      - Hello
      - Excuse me
      english_answer:
      - I am 25 years old
    - order_index: 7
      type: word_bank
      english_prompt: 'Arrange: ''Where are you from?'''
      english_tokens:
      - Where
      - are
      - you
      - from
      english_answer:
      - Where
      - are
      - you
      - from
