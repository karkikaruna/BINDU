units:
- order_index: 1
  name: Greetings
  color_theme: '#0038A8'
  lessons:
  - order_index: 1
    name: Hello & Goodbye
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: How do you say 'Hello' in Nepali?
      english_options:
      - Hello
      - Thank you
      - Excuse me
      - How are you
      english_answer:
      - Hello
    - order_index: 2
      type: word_bank
      english_prompt: 'Arrange the words: ''How are you?'''
      english_tokens:
      - You (formal)
      - how
      - is/are
      english_answer:
      - You (formal)
      - how
      - is/are
    - order_index: 3
      type: multiple_choice
      english_prompt: Which word means 'Goodbye' (see you again)?
      english_options:
      - Goodbye
      - Hello
      - Thank you
      - Please
      english_answer:
      - Goodbye
    - order_index: 4
      type: multiple_choice
      english_prompt: Which greeting means 'Good morning'?
      english_options:
      - Good morning
      - Good night
      - Goodbye
      - Excuse me
      english_answer:
      - Good morning
    - order_index: 5
      type: multiple_choice
      english_prompt: '''Namaste'' can be used for both ___'
      english_options:
      - Hello and Goodbye
      - Yes and No
      - Please and Sorry
      - Big and Small
      english_answer:
      - Hello and Goodbye
    - order_index: 6
      type: word_bank
      english_prompt: 'Arrange: ''Nice to meet you'''
      english_tokens:
      - Nice
      - to
      - meet
      - you
      english_answer:
      - Nice
      - to
      - meet
      - you
    - order_index: 7
      type: multiple_choice
      english_prompt: How do you informally ask a friend 'how are you'?
      english_options:
      - तिमीलाई कस्तो छ?
      - तपाईंलाई कस्तो छ?
      - धन्यवाद
      - नमस्ते
      english_answer:
      - तिमीलाई कस्तो छ?
  - order_index: 2
    name: Please & Thank You
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: Which word means 'Thank you'?
      english_options:
      - Thank you
      - Hello
      - Excuse me
      - Good / nice
      english_answer:
      - Thank you
    - order_index: 2
      type: multiple_choice
      english_prompt: Which word means 'Please'?
      english_options:
      - Please
      - Sorry
      - Welcome
      - Goodbye
      english_answer:
      - Please
    - order_index: 3
      type: multiple_choice
      english_prompt: How do you say 'You're welcome'?
      english_options:
      - You're welcome
      - Thank you
      - Please
      - Sorry
      english_answer:
      - You're welcome
    - order_index: 4
      type: multiple_choice
      english_prompt: Which phrase means 'Excuse me / Sorry'?
      english_options:
      - Excuse me
      - Thank you
      - Please
      - Welcome
      english_answer:
      - Excuse me
    - order_index: 5
      type: word_bank
      english_prompt: 'Arrange: ''Please give me water'''
      english_tokens:
      - Please
      - give
      - me
      - water
      english_answer:
      - Please
      - give
      - me
      - water
    - order_index: 6
      type: multiple_choice
      english_prompt: Which phrase means 'No, thank you'?
      english_options:
      - No, thank you
      - Yes please
      - Thank you very much
      - Excuse me
      english_answer:
      - No, thank you
    - order_index: 7
      type: word_bank
      english_prompt: 'Arrange: ''Thank you very much'''
      english_tokens:
      - Thank
      - you
      - very
      - much
      english_answer:
      - Thank
      - you
      - very
      - much
  - order_index: 3
    name: Introducing Yourself
    exercises:
