units:
- order_index: 1
  name: Greetings
  color_theme: '#0038A8'
  lessons:
  - order_index: 1
    name: Hello & Goodbye
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: How do you say 'Hello' in Nepali?
      english_options:
      - Hello
      - Thank you
      - Excuse me
      - How are you
      english_answer:
      - Hello
      nepali_prompt: तपाईं नेपालीमा 'Hello' कसरी भन्नुहुन्छ?
      nepali_options:
      - नमस्ते
      - धन्यवाद
      - माफ गर्नुहोस्
      - तपाईंलाई कस्तो छ?
      nepali_answer:
      - नमस्ते
    - order_index: 2
      type: word_bank
      english_prompt: 'Arrange the words: ''How are you?'''
      english_tokens:
      - You (formal)
      - how
      - is/are
      english_answer:
      - You (formal)
      - how
      - is/are
      nepali_prompt: 'शब्दहरू मिलाउनुहोस्: ''तपाईंलाई कस्तो छ?'''
      nepali_tokens:
      - तपाईंलाई
      - कस्तो
      - छ
      nepali_answer:
      - तपाईंलाई
      - कस्तो
      - छ
    - order_index: 3
      type: multiple_choice
      english_prompt: Which word means 'Goodbye' (see you again)?
      english_options:
      - Goodbye
      - Hello
      - Thank you
      - Please
      english_answer:
      - Goodbye
      nepali_prompt: कुन शब्दको अर्थ 'अलविदा' (फेरि भेटौँला) हो?
      nepali_options:
      - अलविदा
      - नमस्ते
      - धन्यवाद
      - कृपया
      nepali_answer:
      - अलविदा
    - order_index: 4
      type: multiple_choice
      english_prompt: Which greeting means 'Good morning'?
      english_options:
      - Good morning
      - Good night
      - Goodbye
      - Excuse me
      english_answer:
      - Good morning
      nepali_prompt: '''शुभ प्रभात'' को अर्थ कुन हो?'
      nepali_options:
      - शुभ प्रभात
      - शुभ रात्री
      - अलविदा
      - माफ गर्नुहोस्
      nepali_answer:
      - शुभ प्रभात
    - order_index: 5
      type: multiple_choice
      english_prompt: '''Namaste'' can be used for both ___'
      english_options:
      - Hello and Goodbye
      - Yes and No
      - Please and Sorry
      - Big and Small
      english_answer:
      - Hello and Goodbye
      nepali_prompt: '''नमस्ते'' दुबैका लागि प्रयोग गर्न सकिन्छ ___'
      nepali_options:
      - नमस्ते र अलविदा
      - हो र होइन
      - कृपया र माफ गर्नुहोस्
      - ठूलो र सानो
      nepali_answer:
      - नमस्ते र अलविदा
    - order_index: 6
      type: word_bank
      english_prompt: 'Arrange: ''Nice to meet you'''
      english_tokens:
      - Nice
      - to
      - meet
      - you
      english_answer:
      - Nice
      - to
      - meet
      - you
      nepali_prompt: 'मिलाउनुहोस्: ''तपाईंलाई भेटेर खुशी लाग्यो'''
      nepali_tokens:
      - तपाईंलाई
      - भेटेर
      - खुशी
      - लाग्यो
      nepali_answer:
      - तपाईंलाई
      - भेटेर
      - खुशी
      - लाग्यो
    - order_index: 7
      type: multiple_choice
      english_prompt: How do you informally ask a friend 'how are you'?
      english_options:
      - तिमीलाई कस्तो छ?
      - तपाईंलाई कस्तो छ?
      - धन्यवाद
      - नमस्ते
      english_answer:
      - तिमीलाई कस्तो छ?
      nepali_prompt: कसरी अनौपचारिक रूपमा साथीलाई 'तिमी कस्तो छौ' भनेर सोध्ने?
      nepali_options:
      - तिमीलाई कस्तो छ?
      - तपाईंलाई कस्तो छ?
      - धन्यवाद
      - नमस्ते
      nepali_answer:
      - तिमीलाई कस्तो छ?
  - order_index: 2
    name: Please & Thank You
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: Which word means 'Thank you'?
      english_options:
      - Thank you
      - Hello
      - Excuse me
      - Good / nice
      english_answer:
      - Thank you
      nepali_prompt: कुन शब्दको अर्थ 'धन्यवाद' हो?
      nepali_options:
      - धन्यवाद
      - नमस्ते
      - माफ गर्नुहोस्
      - राम्रो
      nepali_answer:
      - धन्यवाद
    - order_index: 2
      type: multiple_choice
      english_prompt: Which word means 'Please'?
      english_options:
      - Please
      - Sorry
      - Welcome
      - Goodbye
      english_answer:
      - Please
      nepali_prompt: कुन शब्दको अर्थ 'कृपया' हो?
      nepali_options:
      - कृपया
      - माफ गर्नुहोस्
      - स्वागत छ
      - अलविदा
      nepali_answer:
      - कृपया
    - order_index: 3
      type: multiple_choice
      english_prompt: How do you say 'You're welcome'?
      english_options:
      - You're welcome
      - Thank you
      - Please
      - Sorry
      english_answer:
      - You're welcome
      nepali_prompt: तपाईं कसरी भन्नुहुन्छ 'तपाईंलाई स्वागत छ'?
      nepali_options:
      - तपाईंलाई स्वागत छ
      - धन्यवाद
      - कृपया
      - माफ गर्नुहोस्
      nepali_answer:
      - तपाईंलाई स्वागत छ
    - order_index: 4
      type: multiple_choice
      english_prompt: Which phrase means 'Excuse me / Sorry'?
      english_options:
      - Excuse me
      - Thank you
      - Please
      - Welcome
      english_answer:
      - Excuse me
      nepali_prompt: कुन वाक्यांशको अर्थ 'माफ गर्नुहोस्' हो?
      nepali_options:
      - माफ गर्नुहोस्
      - धन्यवाद
      - कृपया
      - स्वागत छ
      nepali_answer:
      - माफ गर्नुहोस्
    - order_index: 5
      type: word_bank
      english_prompt: 'Arrange: ''Please give me water'''
      english_tokens:
      - Please
      - give
      - me
      - water
      english_answer:
      - Please
      - give
      - me
      - water
      nepali_prompt: 'मिलाउनुहोस्: ''कृपया मलाई पानी दिनुहोस्'''
      nepali_tokens:
      - कृपया
      - मलाई
      - पानी
      - दिनुहोस्
      nepali_answer:
      - कृपया
      - मलाई
      - पानी
      - दिनुहोस्
    - order_index: 6
      type: multiple_choice
      english_prompt: Which phrase means 'No, thank you'?
      english_options:
      - No, thank you
      - Yes please
      - Thank you very much
      - Excuse me
      english_answer:
      - No, thank you
      nepali_prompt: कुन वाक्यांशको अर्थ 'होइन, धन्यवाद' हो?
      nepali_options:
      - होइन, धन्यवाद
      - हुन्छ, कृपया
      - धेरै धेरै धन्यवाद
      - माफ गर्नुहोस्
      nepali_answer:
      - होइन, धन्यवाद
    - order_index: 7
      type: word_bank
      english_prompt: 'Arrange: ''Thank you very much'''
      english_tokens:
      - Thank
      - you
      - very
      - much
      english_answer:
      - Thank
      - you
      - very
      - much
      nepali_prompt: 'व्यवस्थित गर्नुहोस्: ''तपाईंलाई धेरै धेरै धन्यवाद'''
      nepali_tokens:
      - तपाईंलाई
      - धेरै
      - धेरै
      - धन्यवाद
      nepali_answer:
      - तपाईंलाई
      - धेरै
      - धेरै
      - धन्यवाद
  - order_index: 3
    name: Introducing Yourself
    exercises:
    - order_index: 1
      type: word_bank
      english_prompt: 'Arrange: ''My name is Max'''
      english_tokens:
      - My
      - name
      - max
      - is
      english_answer:
      - My
      - name
      - max
      - is
      nepali_prompt: 'व्यवस्थित गर्नुहोस्: ''मेरो नाम मैक्स हो'''
      nepali_tokens:
      - मेरो
      - नाम
      - मैक्स
      - हो
      nepali_answer:
      - मेरो
      - नाम
      - मैक्स
      - हो
    - order_index: 2
      type: multiple_choice
      english_prompt: How do you ask 'What is your name?'
      english_options:
      - what is your name?
      - tell me your age
      - where are you from
      - how are you
      english_answer:
      - what is your name?
      nepali_prompt: कसरी सोध्ने 'तपाईंको नाम के हो?'
      nepali_options:
      - तपाईंको नाम के हो?
      - मलाई तपाईंको उमेर भन्नुहोस्
      - तपाईं कहाँबाट हुनुहुन्छ?
      - तपाईंलाई कस्तो छ?
      nepali_answer:
      - तपाईंको नाम के हो?
    - order_index: 3
      type: multiple_choice
      english_prompt: Which sentence means 'I am from Nepal'?
      english_options:
      - I live in Nepal
      - I am from Nepal
      - I have visited Nepal
      - I want to visit Nepal
      english_answer:
      - I am from Nepal
      nepali_prompt: '''म नेपालबाट हुँ'' भन्ने वाक्य कुन हो?'
      nepali_options:
      - म नेपालमा बस्छु
      - म नेपालबाट हुँ
      - मैले नेपाल भ्रमण गरेको छु
      - म नेपाल घुम्न चाहन्छु
      nepali_answer:
      - म नेपालबाट हुँ
    - order_index: 4
      type: word_bank
      english_prompt: 'Arrange: ''I am a student'''
      english_tokens:
      - I
      - am
      - a
      - student
      english_answer:
      - I
      - am
      - a
      - student
      nepali_prompt: 'व्यवस्थित गर्नुहोस्: ''म एक विद्यार्थी हुँ'''
      nepali_tokens:
      - म
      - एक
      - विद्यार्थी
      - हुँ
      nepali_answer:
      - म
      - एक
      - विद्यार्थी
      - हुँ
    - order_index: 5
      type: multiple_choice
      english_prompt: Which phrase means 'Nice to meet you'?
      english_options:
      - Nice to meet you
      - See you tomorrow
      - How much is it
      - I am hungry
      english_answer:
      - Nice to meet you
      nepali_prompt: कुन वाक्यांशको अर्थ 'तपाईंलाई भेटेर खुशी लाग्यो' हो?
      nepali_options:
      - तपाईंलाई भेटेर खुशी लाग्यो
      - भोलि भेटौंला
      - यो कति हो
      - मलाई भोक लागेको छ
      nepali_answer:
      - तपाईंलाई भेटेर खुशी लाग्यो
    - order_index: 6
      type: multiple_choice
      english_prompt: 'Fill in: ''I am 25 years old'''
      english_options:
      - I am feeling tired
      - I am 25 years old
      - Hello
      - Excuse me
      english_answer:
      - I am 25 years old
      nepali_prompt: 'भर्नुहोस्: ''म २५ वर्षको छु'''
      nepali_options:
      - मलाई थकाइ लागेको छ
      - म २५ वर्षको छु
      - नमस्ते
      - माफ गर्नुहोस्
      nepali_answer:
      - म २५ वर्षको छु
    - order_index: 7
      type: word_bank
      english_prompt: 'Arrange: ''Where are you from?'''
      english_tokens:
      - Where
      - are
      - you
      - from
      english_answer:
      - Where
      - are
      - you
      - from
      nepali_prompt: 'व्यवस्थित गर्नुहोस्: ''तपाईं कहाँबाट हुनुहुन्छ?'''
      nepali_tokens:
      - तपाईं
      - कहाँ
      - बाट
      - हुनुहुन्छ
      nepali_answer:
      - तपाईं
      - कहाँ
      - बाट
      - हुनुहुन्छ
