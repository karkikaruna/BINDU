units:
- order_index: 1
  name: Greetings
  color_theme: '#0038A8'
  lessons:
  - order_index: 1
    name: Hello & Goodbye
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: How do you say 'Hello' in Nepali?
      english_options:
      - Hello
      - Thank you
      - Excuse me
      - How are you
      english_answer:
      - Hello
      nepali_prompt_draft: तपाईं नेपालीमा 'हेलो' कसरी भन्नुहुन्छ?
      nepali_options_draft:
      - नमस्ते
      - Gurung
      - मलाईं माफ गर्नुहोस्।
      - तपाईंलाई
      nepali_answer_draft:
      - नमस्ते
    - order_index: 2
      type: word_bank
      english_prompt: 'Arrange the words: ''How are you?'''
      english_tokens:
      - You (formal)
      - how
      - is/are
      english_answer:
      - You (formal)
      - how
      - is/are
      nepali_prompt_draft: 'शब्दहरू मिलाउनुहोस्: ''तिमी कसरी छौ ?'''
      nepali_tokens_draft:
      - तपाईं (औपचारिक)
      - how
      - छ/छन्
      nepali_answer_draft:
      - तपाईं (औपचारिक)
      - how
      - छ/छन्
    - order_index: 3
      type: multiple_choice
      english_prompt: Which word means 'Goodbye' (see you again)?
      english_options:
      - Goodbye
      - Hello
      - Thank you
      - Please
      english_answer:
      - Goodbye
      nepali_prompt_draft: कुन शब्दको अर्थ 'अलविदा' (फेरि भेटौँला) हो?
      nepali_options_draft:
      - अलविदा
      - नमस्ते
      - Gurung
      - कृपया
      nepali_answer_draft:
      - अलविदा
    - order_index: 4
      type: multiple_choice
      english_prompt: Which greeting means 'Good morning'?
      english_options:
      - Good morning
      - Good night
      - Goodbye
      - Excuse me
      english_answer:
      - Good morning
      nepali_prompt_draft: '''शुभ प्रभात'' को अर्थ कुन हो?'
      nepali_options_draft:
      - शुभ प्रभात
      - शुभ रात्रि
      - अलविदा
      - मलाईं माफ गर्नुहोस्।
      nepali_answer_draft:
      - शुभ प्रभात
    - order_index: 5
      type: multiple_choice
      english_prompt: '''Namaste'' can be used for both ___'
      english_options:
      - Hello and Goodbye
      - Yes and No
      - Please and Sorry
      - Big and Small
      english_answer:
      - Hello and Goodbye
      nepali_prompt_draft: '''नमस्ते'' दुबैका लागि प्रयोग गर्न सकिन्छ ___'
      nepali_options_draft:
      - नमस्ते र अलविदा
      - हो र होइन
      - कृपया र माफ गर्नुहोस्
      - ठूलो र सानो
      nepali_answer_draft:
      - नमस्ते र अलविदा
    - order_index: 6
      type: word_bank
      english_prompt: 'Arrange: ''Nice to meet you'''
      english_tokens:
      - Nice
      - to
      - meet
      - you
      english_answer:
      - Nice
      - to
      - meet
      - you
      nepali_prompt_draft: 'मिलाउनुहोस्: ''तपाईलाई भेटेर खुशी लाग्यो'''
      nepali_tokens_draft:
      - राम्रो
      - को
      - भेट्न
      - तिमी
      nepali_answer_draft:
      - राम्रो
      - को
      - भेट्न
      - तिमी
    - order_index: 7
      type: multiple_choice
      english_prompt: How do you informally ask a friend 'how are you'?
      english_options:
      - तिमीलाई कस्तो छ?
      - तपाईंलाई कस्तो छ?
      - धन्यवाद
      - नमस्ते
      english_answer:
      - तिमीलाई कस्तो छ?
      nepali_prompt_draft: कसरी अनौपचारिक रूपमा साथीलाई 'तिमी कस्तो छ' भनेर सोध्ने?
      nepali_options_draft:
      - तिमीलाई कुरा छ?
      - तपाईलाई छ?
      - धन्यवाद
      - नमस्ते
      nepali_answer_draft:
      - तिमीलाई कुरा छ?
  - order_index: 2
    name: Please & Thank You
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: Which word means 'Thank you'?
      english_options:
      - Thank you
      - Hello
      - Excuse me
      - Good / nice
      english_answer:
      - Thank you
      nepali_prompt_draft: कुन शब्दको अर्थ 'धन्यवाद' हो?
      nepali_options_draft:
      - Gurung
      - नमस्ते
      - मलाईं माफ गर्नुहोस्।
      - राम्रो / राम्रो
      nepali_answer_draft:
      - Gurung
    - order_index: 2
      type: multiple_choice
      english_prompt: Which word means 'Please'?
      english_options:
      - Please
      - Sorry
      - Welcome
      - Goodbye
      english_answer:
      - Please
      nepali_prompt_draft: कुन शब्दको अर्थ 'कृपया' हो?
      nepali_options_draft:
      - कृपया
      - माफ गर्नुहोस्
      - स्वागत छ
      - अलविदा
      nepali_answer_draft:
      - कृपया
    - order_index: 3
      type: multiple_choice
      english_prompt: How do you say 'You're welcome'?
      english_options:
      - You're welcome
      - Thank you
      - Please
      - Sorry
      english_answer:
      - You're welcome
      nepali_prompt_draft: तपाईं कसरी भन्नुहुन्छ 'तिमीलाई स्वागत छ'?
      nepali_options_draft:
      - तपाईंलाई स्वागत छ
      - Gurung
      - कृपया
      - माफ गर्नुहोस्
      nepali_answer_draft:
      - तपाईंलाई स्वागत छ
    - order_index: 4
      type: multiple_choice
      english_prompt: Which phrase means 'Excuse me / Sorry'?
      english_options:
      - Excuse me
      - Thank you
      - Please
      - Welcome
      english_answer:
      - Excuse me
      nepali_prompt_draft: कुन वाक्यांशको अर्थ 'माफ गर्नुहोस् / माफ गर्नुहोस्' हो?
      nepali_options_draft:
      - मलाईं माफ गर्नुहोस्।
      - Gurung
      - कृपया
      - स्वागत छ
      nepali_answer_draft:
      - मलाईं माफ गर्नुहोस्।
    - order_index: 5
      type: word_bank
      english_prompt: 'Arrange: ''Please give me water'''
      english_tokens:
      - Please
      - give
      - me
      - water
      english_answer:
      - Please
      - give
      - me
      - water
      nepali_prompt_draft: 'मिलाउनुहोस्: ''कृपया मलाई पानी दिनुहोस्'''
      nepali_tokens_draft:
      - कृपया
      - दिनुहोस्
      - म
      - पानी
      nepali_answer_draft:
      - कृपया
      - दिनुहोस्
      - म
      - पानी
    - order_index: 6
      type: multiple_choice
      english_prompt: Which phrase means 'No, thank you'?
      english_options:
      - No, thank you
      - Yes please
      - Thank you very much
      - Excuse me
      english_answer:
      - No, thank you
      nepali_prompt_draft: कुन वाक्यांशको अर्थ 'होइन, धन्यवाद' हो?
      nepali_options_draft:
      - होइन, धन्यवाद
      - हो कृपया
      - धेरै धेरै धन्यवाद
      - मलाईं माफ गर्नुहोस्।
      nepali_answer_draft:
      - होइन, धन्यवाद
    - order_index: 7
      type: word_bank
      english_prompt: 'Arrange: ''Thank you very much'''
      english_tokens:
      - Thank
      - you
      - very
      - much
      english_answer:
      - Thank
      - you
      - very
      - much
      nepali_prompt_draft: 'व्यवस्थित गर्नुहोस्: ''धेरै धेरै धन्यवाद'''
      nepali_tokens_draft:
      - धन्यवाद
      - तिमी
      - धेरै
      - धेरै
      nepali_answer_draft:
      - धन्यवाद
      - तिमी
      - धेरै
      - धेरै
  - order_index: 3
    name: Introducing Yourself
    exercises:
    - order_index: 1
      type: word_bank
      english_prompt: 'Arrange: ''My name is max'''
      english_tokens:
      - My
      - name
      - max
      - is
      english_answer:
      - My
      - name
      - max
      - is
      nepali_prompt_draft: 'व्यवस्थित गर्नुहोस्: ''मेरो नाम अधिकतम हो'''
      nepali_tokens_draft:
      - मेरो विद्यालयमा
      - प्रस्तुत कर्ता
      - अधिकतम
      - हो
      nepali_answer_draft:
      - मेरो विद्यालयमा
      - प्रस्तुत कर्ता
      - अधिकतम
      - हो
    - order_index: 2
      type: multiple_choice
      english_prompt: How do you ask 'What is your name?'
      english_options:
      - what is your name?
      - tell me your age
      - where are you from
      - how are you
      english_answer:
      - what is your name?
      nepali_prompt_draft: कसरी सोध्ने 'तिम्रो नाम के हो?'
      nepali_options_draft:
      - तिम्रो नाम के हो
      - मलाई तिम्रो उमेर भन्नुहोस्
      - तपाईं कहाँबाट हुनुहुन्छ
      - तपाई कस्तो हुनुहुन्छ
      nepali_answer_draft:
      - तिम्रो नाम के हो
    - order_index: 3
      type: multiple_choice
      english_prompt: Which sentence means 'I am from Nepal'?
      english_options:
      - I live in Nepal
      - I am from Nepal
      - I have visited Nepal
      - I want to visit Nepal
      english_answer:
      - I am from Nepal
      nepali_prompt_draft: ‘म नेपालबाट हुँ’ भन्ने वाक्य कुन हो ?
      nepali_options_draft:
      - म नेपालमा बस्छु
      - म नेपाल बाट हुँ
      - नेपाल भ्रमण गरेको छु
      - म नेपाल घुम्न चाहन्छु
      nepali_answer_draft:
      - म नेपाल बाट हुँ
    - order_index: 4
      type: word_bank
      english_prompt: 'Arrange: ''I am a student'''
      english_tokens:
      - I
      - am
      - a
      - student
      english_answer:
      - I
      - am
      - a
      - student
      nepali_prompt_draft: 'व्यवस्थित गर्नुहोस्: ''म एक विद्यार्थी हुँ'''
      nepali_tokens_draft:
      - म
      - am
      - a
      - विद्यार्थी
      nepali_answer_draft:
      - म
      - am
      - a
      - विद्यार्थी
    - order_index: 5
      type: multiple_choice
      english_prompt: Which phrase means 'Nice to meet you'?
      english_options:
      - Nice to meet you
      - See you tomorrow
      - How much is it
      - I am hungry
      english_answer:
      - Nice to meet you
      nepali_prompt_draft: कुन वाक्यांशको अर्थ 'तपाईलाई भेटेर खुशी लाग्यो'?
      nepali_options_draft:
      - तिमीलाई भेटेर खुशी लाग्यो
      - भोलि भेटौला
      - कति छ
      - मलाई भोक लागेको छ
      nepali_answer_draft:
      - तिमीलाई भेटेर खुशी लाग्यो
    - order_index: 6
      type: multiple_choice
      english_prompt: 'Fill in: ''I am 25 years old'''
      english_options:
      - I am feeling tired
      - I am 25 years old
      - Hello
      - Excuse me
      english_answer:
      - I am 25 years old
      nepali_prompt_draft: 'भर्नुहोस्: ''म २५ वर्षको हुँ'''
      nepali_options_draft:
      - मलाई थकाइ लागेको छ
      - म २५ वर्षको भएँ
      - नमस्ते
      - मलाईं माफ गर्नुहोस्।
      nepali_answer_draft:
      - म २५ वर्षको भएँ
    - order_index: 7
      type: word_bank
      english_prompt: 'Arrange: ''Where are you from?'''
      english_tokens:
      - Where
      - are
      - you
      - from
      english_answer:
      - Where
      - are
      - you
      - from
      nepali_prompt_draft: 'व्यवस्थित गर्नुहोस्: ''तपाईं कहाँबाट हुनुहुन्छ?'''
      nepali_tokens_draft:
      - कहाँ
      - छन्
      - तिमी
      - बाट
      nepali_answer_draft:
      - कहाँ
      - छन्
      - तिमी
      - बाट
