      - नमस्ते
      - धन्यवाद
      - माफ गर्नुहोस्
      - तपाईंलाई कस्तो छ?
      nepali_answer:
      - नमस्ते
      audio_url: https://jkwpvxbcwrtgyxacerhh.supabase.co/storage/v1/object/public/audio/0c615ca638e340ac90ab87a6db88480a.mp3
    - order_index: 2
      type: word_bank
      english_prompt: 'Arrange the words: ''How are you?'''
      english_tokens:
      - You (formal)
      - how
      - is/are
      english_answer:
      - You (formal)
      - how
      - is/are
      nepali_prompt: 'शब्दहरू मिलाउनुहोस्: ''तपाईंलाई कस्तो छ?'''
      nepali_tokens:
      - तपाईंलाई
      - कस्तो
      - छ
      nepali_answer:
      - तपाईंलाई
      - कस्तो
      - छ
      audio_url: https://jkwpvxbcwrtgyxacerhh.supabase.co/storage/v1/object/public/audio/7b94168c573f40cfb5f316315cb5ff94.mp3
    - order_index: 3
