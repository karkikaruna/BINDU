      - शुभ रात्री
      - अलविदा
      - माफ गर्नुहोस्
      nepali_answer:
      - शुभ प्रभात
      audio_url: https://zwpnwvinfqjhjhtvutsu.supabase.co/storage/v1/object/public/audio/58d2f7badcbe4ed394e1c36741d99c20.mp3
    - order_index: 5
      type: multiple_choice
      english_prompt: '''Namaste'' can be used for both ___'
      english_options:
