units:
- order_index: 1
  name: Greetings
  color_theme: '#0038A8'
  lessons:
  - order_index: 1
    name: Hello & Goodbye
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: How do you say 'Hello' in Nepali?
      english_options:
      - Hello
      - Thank you
      - Excuse me
      - How are you
      english_answer:
      - Hello
      nepali_prompt: तपाईं नेपालीमा 'Hello' कसरी भन्नुहुन्छ?
      nepali_options:
      - नमस्ते
      - धन्यवाद
      - माफ गर्नुहोस्
      - तपाईंलाई कस्तो छ?
      nepali_answer:
      - नमस्ते
      audio_url: https://zwpnwvinfqjhjhtvutsu.supabase.co/storage/v1/object/public/audio/ac05f8af7411436785a550bf44f2ca02.mp3
    - order_index: 2
      type: word_bank
      english_prompt: 'Arrange the words: ''How are you?'''
      english_tokens:
      - You (formal)
      - how
      - is/are
      english_answer:
      - You (formal)
      - how
      - is/are
      nepali_prompt: 'शब्दहरू मिलाउनुहोस्: ''तपाईंलाई कस्तो छ?'''
      nepali_tokens:
      - तपाईंलाई
      - कस्तो
      - छ
      nepali_answer:
      - तपाईंलाई
      - कस्तो
      - छ
      audio_url: https://zwpnwvinfqjhjhtvutsu.supabase.co/storage/v1/object/public/audio/583ea16633bf42e1aa6054cb1d7949b7.mp3
    - order_index: 3
      type: multiple_choice
      english_prompt: Which word means 'Goodbye' (see you again)?
      english_options:
      - Goodbye
      - Hello
      - Thank you
      - Please
      english_answer:
      - Goodbye
      nepali_prompt: कुन शब्दको अर्थ 'अलविदा' (फेरि भेटौँला) हो?
      nepali_options:
      - अलविदा
      - नमस्ते
      - धन्यवाद
      - कृपया
      nepali_answer:
      - अलविदा
