units:
- order_index: 1
  name: Greetings
  color_theme: '#0038A8'
  lessons:
  - order_index: 1
    name: Hello & Goodbye
    exercises:
    - order_index: 1
      type: multiple_choice
      english_prompt: How do you say 'Hello' in Nepali?
      english_options:
      - Hello
      - Thank you
      - Excuse me
      - How are you
      english_answer:
      - Hello
      nepali_prompt: तपाईं नेपालीमा 'Hello' कसरी भन्नुहुन्छ?
      nepali_options:
      - नमस्ते
      - धन्यवाद
      - माफ गर्नुहोस्
      - तपाईंलाई कस्तो छ?
      nepali_answer:
      - नमस्ते
      audio_url: https://fbaogelkfunfsqytwztx.supabase.co/storage/v1/object/public/audio/689420daa39af1d29a5ff419f3713a48.mp3
    - order_index: 2
      type: word_bank
      english_prompt: 'Arrange the words: ''How are you?'''
      english_tokens:
      - You (formal)
      - how
      - is/are
      english_answer:
      - You (formal)
      - how
      - is/are
      nepali_prompt: 'शब्दहरू मिलाउनुहोस्: ''तपाईंलाई कस्तो छ?'''
      nepali_tokens:
      - तपाईंलाई
      - कस्तो
      - छ
      nepali_answer:
      - तपाईंलाई
      - कस्तो
      - छ
      audio_url: https://fbaogelkfunfsqytwztx.supabase.co/storage/v1/object/public/audio/de2ea8d48e31f02cbb4bfa7dae723064.mp3
    - order_index: 3
      type: multiple_choice
      english_prompt: Which word means 'Goodbye' (see you again)?
